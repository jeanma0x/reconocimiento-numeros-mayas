# Configuración por defecto. No hardcodear estos valores en el código.

semilla: 42

datos:
  manifiesto: data_local/manifest.csv
  raiz: data_local
  autor_prueba: null          # integrante excluido del entrenamiento (leave-one-person-out)
  lado: 64                     # tamaño de entrada del modelo (ADR-005)

sintetico:
  por_clase_valida: 1500
  negativos_total: 15000
  refuerzo_neg: {cuatro_barras: 4500, muchos_puntos: 1500, carita: 3000}
  refuerzo_gruesa: {5: 500, 6: 800, 7: 800, 8: 800, 9: 1500, 10: 500, 11: 1500, 12: 800, 13: 800, 14: 500, 15: 600}
  refuerzo: {1: 1500, 2: 1500, 3: 1200, 6: 800, 7: 800, 9: 800, 15: 800, 16: 800}
  lienzo_px: 256
  # Rangos de variación (docs/03-DATASET.md)
  grosor_barra: [0.03, 0.14]   # fracción del alto del glifo
  radio_punto: [0.04, 0.12]    # fracción del ancho
  rotacion_grados: [-15, 15]
  perspectiva_max: 0.12
  ocupacion_glifo: [0.25, 0.90]
  fondos: [papel_blanco, cuadriculado, rayado, cartulina, pizarron_blanco,
           pizarron_verde, madera, servilleta]
  tintas: [negro, azul, rojo, verde, grafito]

aumento:
  rotacion_grados: 12
  traslacion: 0.12
  escala: [0.85, 1.15]
  shear: 8
  brillo: 0.25
  contraste: 0.25
  desenfoque_prob: 0.3
  borrado_prob: 0.2
  # Prohibido voltear: un volteo vertical produce un caso `no_valido` real

modelo:
  arquitectura: cnn_maya       # cnn_maya | mobilenet_v3_small
  dropout: 0.3
  peso_cabeza_barras: 0.3
  peso_cabeza_puntos: 0.3
  label_smoothing: 0.05

entrenamiento:
  etapa_a:
    epocas: 60
    lote: 128
    lr: 3.0e-4
    weight_decay: 1.0e-4
    calentamiento_epocas: 3
    paciencia: 8
  etapa_b:
    epocas: 5
    lote: 64
    lr: 1.2e-4
    repeticiones_reales: 10
    fraccion_sintetico: 0.3
    paciencia: 4

calibracion:
  peso_acierto_valida: 0.8      # pesos de la rúbrica (ADR-006)
  peso_rechazo_no_valida: 0.2
  rejilla_tau: [0.05, 0.95, 0.01]
  rejilla_margen: [0.0, 0.5, 0.01]

export:
  opset: 17
  tolerancia: 1.0e-5
  n_verificacion: 200
  destino: ../web/public/models
