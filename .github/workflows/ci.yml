name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    name: Tests de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r ml/requirements.txt
      - run: cd ml && pytest

  web:
    name: Build y paridad del preprocesamiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run build
      # Si la paridad del preprocesamiento falla, no se despliega (invariante I4)
      - run: cd web && npm run test:parity
